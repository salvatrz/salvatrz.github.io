<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ARCHIVOS</title>

<style>
  body {
    background-color: black;
    color: #e0e0e0;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  .pantalla-falsa, .contenedor {
    max-width: 600px;
    margin: auto;
    padding-top: 150px;
    display: none;
  }

  .pantalla-falsa {
    display: block;
  }

  h1 {
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: normal;
  }

  p {
    font-size: 14px;
    opacity: 0.85;
  }

  button {
    margin-top: 30px;
    background: black;
    color: #e0e0e0;
    border: 1px solid #333;
    padding: 10px 25px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  video, img {
    width: 100%;
    margin-top: 30px;
    border: 1px solid #222;
  }
</style>

<script>
  let intentos = 0;

  // PUEDES CAMBIAR O AGREGAR CÓDIGOS AQUÍ
  const codigosValidos = ["MAYA", "ARCHIVOS", "SECRETO", "A"];

  const mensajes = [
    "No debiste volver aquí.<br>— A",
    "Te estoy observando.<br>— A",
    "Sabes exactamente lo que hiciste.<br>— A",
    "Creíste que nadie lo notaría?<br>— A",
    "Algunos secretos no te pertenecen.<br>— A",
    "Esto no ha terminado.<br>— A"
  ];

  function pedirCodigo() {
    let codigo = prompt("Introduce el código");

    if (
      codigo &&
      codigosValidos.includes(codigo.trim().toUpperCase())
    ) {
      document.querySelector(".pantalla-falsa").style.display = "none";
      document.querySelector(".contenedor").style.display = "block";
    } else {
      intentos++;

      let mensaje = mensajes[Math.floor(Math.random() * mensajes.length)];

      document.querySelector(".pantalla-falsa").innerHTML = `
        <h1>ARCHIVOS</h1>
        <p>${mensaje}</p>
        <button onclick="pedirCodigo()">INTENTAR DE NUEVO</button>
      `;

      if (intentos >= 3) {
        document.querySelector(".pantalla-falsa").innerHTML = `
          <h1>ARCHIVOS</h1>
          <p>Ya sabes demasiado.<br>— A</p>
        `;
      }
    }
  }
</script>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div class="pantalla-falsa">
  <h1>ARCHIVOS</h1>
  <p>No todo está destinado a ser encontrado.<br>— A</p>
  <button onclick="pedirCodigo()">ENTRAR</button>
</div>

<!-- CONTENIDO SECRETO -->
<div class="contenedor">
  <h1>ARCHIVOS</h1>

  <video controls>
    <source src="video1.mp4" type="video/mp4">
  </video>

  <img src="foto1.jpg">

  <p>— A</p>
</div>

</body>
</html>
