<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ARCHIVOS</title>

<style>
  body {
    background-color: black;
    color: #e0e0e0;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  .pantalla-falsa, .contenedor {
    max-width: 600px;
    margin: auto;
    padding-top: 150px;
    display: none;
  }

  .pantalla-falsa {
    display: block;
  }

  button {
    margin-top: 30px;
    background: black;
    color: #e0e0e0;
    border: 1px solid #333;
    padding: 10px 25px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  video, img {
    width: 100%;
    margin-top: 30px;
    border: 1px solid #222;
  }
</style>

<script>
  function pedirCodigo() {
    let codigo = prompt("Introduce el código");

    if (codigo === "MAYA") {
      document.querySelector(".pantalla-falsa").style.display = "none";
      document.querySelector(".contenedor").style.display = "block";
    } else {
      document.body.innerHTML =
        "<h2 style='margin-top:150px;'>Acceso denegado</h2>";
    }
  }
</script>
</head>

<body>

<!-- PANTALLA FALSA -->
<div class="pantalla-falsa">
  <h1>ARCHIVOS</h1>
  <p>No todo está destinado a ser encontrado.</p>
  <button onclick="pedirCodigo()">ENTRAR</button>
</div>

<!-- CONTENIDO REAL -->
<div class="contenedor">
  <h1>ARCHIVOS</h1>

  <video controls>
    <source src="video1.mp4" type="video/mp4">
  </video>

  <img src="foto1.jpg">

  <p>— M</p>
</div>

</body>
</html>
