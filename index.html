<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ARCHIVOS</title>

<style>
  body {
    background-color: black;
    color: #e0e0e0;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: normal;
  }

  p {
    font-size: 14px;
    opacity: 0.85;
  }

  button {
    margin-top: 30px;
    background: black;
    color: #e0e0e0;
    border: 1px solid #333;
    padding: 10px 25px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  .pantalla-falsa {
    text-align: center;
    padding-top: 150px;
  }

  .contenedor {
    display: none;
    padding: 50px 20px;
  }

  /* MURAL DESORDENADO */
  .mural {
    position: relative;
    height: 800px;
    margin-top: 50px;
  }

  .mural img,
  .mural video {
    position: absolute;
    width: 200px;
    border: 1px solid #222;
    opacity: 0.85;
  }
</style>

<script>
  let intentos = 0;

  const codigosValidos = ["MAYA", "ARCHIVOS", "SECRETO", "A"];

  const mensajes = [
    "No debiste volver aquí.<br>— A",
    "Te estoy observando.<br>— A",
    "Sabes exactamente lo que hiciste.<br>— A",
    "Creíste que nadie lo notaría?<br>— A",
    "Esto no ha terminado.<br>— A"
  ];

  function pedirCodigo() {
    let codigo = prompt("Introduce el código");

    if (codigo && codigosValidos.includes(codigo.trim().toUpperCase())) {
      document.querySelector(".pantalla-falsa").style.display = "none";
      document.querySelector(".contenedor").style.display = "block";
    } else {
      intentos++;

      let mensaje = mensajes[Math.floor(Math.random() * mensajes.length)];

      document.querySelector(".pantalla-falsa").innerHTML = `
        <h1>ARCHIVOS</h1>
        <p>${mensaje}</p>
        <button onclick="pedirCodigo()">INTENTAR DE NUEVO</button>
      `;

      if (intentos >= 3) {
        document.querySelector(".pantalla-falsa").innerHTML = `
          <h1>ARCHIVOS</h1>
          <p>Ya sabes demasiado.<br>— A</p>
        `;
      }
    }
  }
</script>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div class="pantalla-falsa">
  <h1>ARCHIVOS</h1>
  <p>No todo está destinado a ser encontrado.<br>— A</p>
  <button onclick="pedirCodigo()">ENTRAR</button>
</div>

<!-- CONTENIDO -->
<div class="contenedor">
  <h1>ARCHIVOS</h1>

  <div class="mural">
    <!-- SOLO CAMBIA LOS NOMBRES DE LOS ARCHIVOS -->
    <img src="foto1.jpg" style="top:40px; left:20px; transform:rotate(-6deg)">
    <img src="foto2.jpg" style="top:220px; left:120px; transform:rotate(5deg)">
    <img src="foto3.jpg" style="top:100px; left:350px; transform:rotate(-10deg)">
    <img src="foto4.jpg" style="top:360px; left:260px; transform:rotate(8deg)">

    <video controls style="top:420px; left:60px; transform:rotate(-4deg)">
      <source src="video1.mp4" type="video/mp4">
    </video>
  </div>

  <p style="text-align:center; margin-top:60px;">— A</p>
</div>

</body>
</html>
